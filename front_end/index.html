<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Petshop - Login</title>
  <!-- Verifique se a importação está exatamente assim: -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1>🐾 Petshop</h1>
      <p>Entre com sua conta</p>
    </div>

    <!-- Div para alertas controlada pelo JS -->
    <div id="alertBox" class="alert-danger d-none"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox"> Lembrar de mim
        </label>
      </div>

      <button type="submit" class="btn-submit">Entrar</button>
    </form>

    <div class="login-footer">
      Não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
